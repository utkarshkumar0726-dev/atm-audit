<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="badgeShadow" x="32" y="32" width="24" height="24" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- 360 Degree Surveillance Orbit Ring -->
  <circle cx="32" cy="32" r="23" stroke="#38bdf8" stroke-width="2.2" stroke-dasharray="34 10 18 8" stroke-linecap="round" opacity="0.8" />

  <!-- ATM Machine Body -->
  <path d="M19 22C19 19.7909 20.7909 18 23 18H41C43.2091 18 45 19.7909 45 22V42C45 44.2091 43.2091 46 41 46H23C20.7909 46 19 44.2091 19 42V22Z" fill="#ffffff" />
  
  <!-- Surveillance Screen / Display Area -->
  <rect x="23" y="22" width="18" height="12" rx="2" fill="#0f172a" />
  
  <!-- Glowing e-Surveillance Camera Lens in ATM Display -->
  <circle cx="32" cy="28" r="3.4" fill="#38bdf8" />
  <circle cx="32" cy="28" r="1.5" fill="#ffffff" />
  <circle cx="25.5" cy="24.5" r="0.8" fill="#38bdf8" opacity="0.9" />

  <!-- Keypad & Cash Dispenser Slots -->
  <rect x="23" y="37" width="18" height="2.2" rx="1.1" fill="#94a3b8" />
  <rect x="26" y="41.5" width="12" height="1.8" rx="0.9" fill="#cbd5e1" />

  <!-- 360 Verified Audit Checkmark Badge -->
  <g filter="url(#badgeShadow)">
    <circle cx="44" cy="44" r="8" fill="url(#accentGrad)" />
    <circle cx="44" cy="44" r="7.2" stroke="#ffffff" stroke-width="1.2" />
    <path d="M41.5 44L43.2 45.8L46.8 42" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>